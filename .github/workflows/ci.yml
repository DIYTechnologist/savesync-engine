name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      # savesyncpspc's own CI uses a bare "YYYY.MMDD.HHMMSS" timestamp tag,
      # which is fine there (those tags label release *artifacts*, never
      # consumed by `go get`). This module is consumed via `go get`/`go.mod`
      # `require`, which mandates real semver (`vMAJOR.MINOR.PATCH`) - a
      # non-semver tag resolves for humans on GitHub but `go get` can't use
      # it. v0.0.<unix-seconds> keeps the same "just tag every push to
      # main, no manual versioning yet" intent, monotonically increasing,
      # while actually being a tag `go get` can consume.
      - name: Create version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="v0.0.$(date -u +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Created tag: $tag" >> "$GITHUB_STEP_SUMMARY"
